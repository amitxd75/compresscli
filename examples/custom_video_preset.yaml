# Custom Video Preset Example
# Usage: compresscli presets create streaming examples/custom_video_preset.yaml
#
# Fields map directly to VideoPresetConfig:
#   codec        — H264 | H265 | Vp9 | Av1
#   crf          — null (use bitrate) or 0–51 (lower = better quality)
#   bitrate      — null (use CRF) or "2M", "500k", etc.
#   audio_codec  — Aac | Mp3 | Opus | Vorbis | Copy
#   audio_bitrate — "128k", "192k", "256k", etc.  (null = encoder default)
#   preset       — ultrafast | superfast | veryfast | faster | fast |
#                  medium | slow | slower | veryslow
#                  Note: VP9/AV1 and hardware encoders ignore this field.
#   two_pass     — true requires a bitrate target (crf must be null)
#   extra_args   — additional FFmpeg flags passed verbatim.
#                  SECURITY: only use trusted values here. Avoid -i, -vf,
#                  -filter_complex, URLs, or paths outside the project.

codec: H264
crf: null
bitrate: "2M"
audio_codec: Aac
audio_bitrate: "128k"
preset: "fast"
two_pass: true
extra_args:
  - "-maxrate"
  - "2.5M"
  - "-bufsize"
  - "5M"