[package]
authors = ["AmitxD"]
categories = ["command-line-utilities", "multimedia"]
description = "A powerful CLI tool for video and image compression"
edition = "2024"
keywords = ["cli", "compression", "ffmpeg", "image", "video"]
license = "MIT"
name = "compresscli"
readme = "README.md"
exclude = ["examples/samples/*", "issues/*"]
repository = "https://github.com/amitxd75/compresscli"
version = "0.1.7"
rust-version = "1.96"

[[bin]]
name = "compresscli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytesize = "2.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["color", "derive"] }
clap_complete = "4.6"
console = "0.16"
dirs = "6.0"
env_logger = "0.11"
glob = "0.3"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
indicatif = { version = "0.18", features = ["tokio"] }
log = "0.4"
num_cpus = "1.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
walkdir = "2.5"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
